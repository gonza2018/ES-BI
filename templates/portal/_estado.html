{% if paquete.estado == "aprobado" %}<span class="badge text-bg-success">{{ paquete.get_estado_display }}</span>{% elif paquete.estado == "en_revision" %}<span class="badge text-bg-warning">{{ paquete.get_estado_display }}</span>{% else %}<span class="badge text-bg-secondary">{{ paquete.get_estado_display }}</span>{% endif %}{% if not paquete.publicado %} <span class="badge text-bg-danger">No publicado</span>{% endif %}
