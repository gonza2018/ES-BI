{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ES & BI | Estadísticas Económicas e Inteligencia de Negocios{% endblock %}</title>
    {% block meta %}{% endblock %}
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'sitio/img/apple-touch-icon.png' %}">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#212529">
    <link rel="stylesheet" href="{% static 'vendor/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'sitio/css/sitio.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="visually-hidden-focusable saltar-contenido" href="#contenido">Saltar al contenido</a>
    {% block content %}{% endblock %}
    <script src="{% static 'vendor/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
